# Power Sentry Voltage Stabilization & Anti-Crash Tuning
# Prevents sudden storage write-back bursts and memory thrashing from pulling down SMPS power rails.

# Start background disk writeback at 32 MB rather than waiting for default ~800 MB
vm.dirty_background_bytes = 33554432

# Hard cap uncommitted dirty pages to 64 MB (smooth continuous trickling to disk)
vm.dirty_bytes = 67108864

# Delay swapping until true memory exhaustion, avoiding the 2.5GB swap storm seen before crashes
vm.swappiness = 10

# Preserve inode and dentry caches to avoid repetitive storage controller draw
vm.vfs_cache_pressure = 50
